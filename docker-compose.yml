# Local object storage for the MedFlow AI backend.
#
# MinIO is S3-compatible, so the same `app/storage/s3.py` code path runs here
# and against real AWS S3.  Moving to AWS means clearing S3_ENDPOINT_URL and
# supplying real credentials -- no application code changes.
#
# The backend itself is not containerised yet.  It runs on the host with
# `uvicorn app.main:app --reload` so the storage work stays easy to debug.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: medflow-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - medflow_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket creation.  Buckets do not exist by default, and the
  # application is deliberately not granted CreateBucket in a real deployment.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: medflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your .env}
      S3_BUCKET: ${S3_BUCKET:-medflow-documents}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET" &&
        mc version enable "local/$$S3_BUCKET"
    restart: "no"

volumes:
  medflow_minio_data:
    name: medflow_minio_data
